[project]
name = "youtune"
version = "0.1.0"
description = "Download YouTube videos and generate Korean subtitles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["yt-dlp[default]>=2026.8.19"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2.1"]

[project.scripts]
youtune = "youtune.cli:main"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"src/youtune/translator.py" = ["S603"]
"src/youtune/muxer.py" = ["S603"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits real YouTube / claude CLI (set YOUTUNE_INTEGRATION=1)"]
addopts = "-m 'not integration'"
